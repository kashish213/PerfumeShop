<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PerfumeShop | Create Account</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <a href="index.html" class="logo">🌸 PerfumeShop</a>

    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Perfumes</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="signin.html">Sign In</a>
    </nav>

    <div class="header-actions">
        <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
    </div>
</header>

<section class="auth-page">

    <div class="auth-card">

        <div class="auth-icon">💗</div>

        <h1>Create Account</h1>
        <p>Join PerfumeShop and discover your perfect scent.</p>

        <form onsubmit="signUp(event)">

            <label>Full Name</label>
            <input type="text" id="signupName" placeholder="Enter your full name" required>

            <label>Email Address</label>
            <input type="email" id="signupEmail" placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" id="signupPassword" placeholder="Create a password" required>

            <label>Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm your password" required>

            <button type="submit" class="auth-btn">Create Account</button>

        </form>

        <p class="auth-footer">
            Already have an account?
            <a href="signin.html">Sign In</a>
        </p>

    </div>

</section>

<footer>
    <div class="footer-logo">🌸 PerfumeShop</div>
    <p class="copyright">© 2026 PerfumeShop. All Rights Reserved.</p>
</footer>

<script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PerfumeShop | Sign In</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <a href="index.html" class="logo">🌸 PerfumeShop</a>

    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Perfumes</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="signin.html" class="active">Sign In</a>
    </nav>

    <div class="header-actions">
        <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
    </div>
</header>

<section class="auth-page">

    <div class="auth-card">

        <div class="auth-icon">🌸</div>

        <h1>Welcome Back</h1>
        <p>Sign in to continue your fragrance journey.</p>

        <form onsubmit="signIn(event)">

            <label>Email Address</label>
            <input type="email" id="signinEmail" placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" id="signinPassword" placeholder="Enter your password" required>

            <div class="form-options">
                <label class="remember">
                    <input type="checkbox"> Remember me
                </label>

                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit" class="auth-btn">Sign In</button>

        </form>

        <p class="auth-footer">
            Don't have an account?
            <a href="signup.html">Create Account</a>
        </p>

    </div>

</section>

<footer>
    <div class="footer-logo">🌸 PerfumeShop</div>
    <p class="copyright">© 2026 PerfumeShop. All Rights Reserved.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
